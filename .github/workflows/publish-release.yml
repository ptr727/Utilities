name: Publish project release action

# Publisher for this repository.
# A human pull request merge never auto-publishes.
# A release is a deliberate dispatch, or a bot merge to main that touches a shipped input.
# The release-gate decision, the build and version job graph, and the NuGet push are hub-hosted tasks this file reaches by pin.
# What stays here is the trigger policy and the per-target wiring, per the fleet's release-chain adoption shape.
#
# The push trigger is main-only, and its inclusion list covers the library source, the version floor, the build configuration, and the package versions.
# A code-affecting bot merge therefore auto-publishes a stable release.
# The plan job computes the gate once, and only the codegen App or Dependabot actor qualifies on a push.
# A human merge or a promotion to main skips, and the maintainer dispatches when release-ready.
#
# The list is inclusion-only, so a path is added when a new input starts affecting the shipped package.
# Package versions are listed because a NuGet version cannot be re-pushed, so a dependency bump must republish to keep the declared dependencies current.
# GitHub Actions bumps are not listed, since they do not ship in the package, so an Actions bump merges without republishing.
#
# A workflow_dispatch publishes the chosen branch, main a stable release and develop a prerelease.
# The publish job needs the same validation the pull request runs, so nothing publishes that would fail it.
on:
  push:
    branches: [main]
    paths:
      - 'Utilities/**'
      - 'version.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
  workflow_dispatch:

# The group is ref-independent so concurrent publishes serialize.
# The cancel-in-progress setting is false so a publish is never cancelled mid-release, which would leave a half-created GitHub release or a partial NuGet push.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# GITHUB_TOKEN gets no scope by default, and each job below grants only what it writes with.
permissions: {}

jobs:

  # Single source of the release-gate decision, publish or not and stable or not, reused by every job below.
  plan:
    name: Plan release job
    uses: ptr727/ProjectTemplate/.github/workflows/publish-plan-task.yml@a3781210c622a61bdd3bbe31a6ac7a431c4a163d # 2.0.525
    with:
      event_name: ${{ github.event_name }}
      actor: ${{ github.actor }}
      ref_name: ${{ github.ref_name }}

  # The same gate the pull request runs, on the branch tip, running only when a publish will happen.
  validate:
    name: Validate job
    needs: [plan]
    if: ${{ needs.plan.outputs.publish == 'true' }}
    uses: ./.github/workflows/validate-task.yml
    secrets: inherit

  # Build, version, push, and release the triggering branch, main a stable release and develop a prerelease by dispatch.
  # This repository ships one target, the NuGet package, so every other target is disabled explicitly rather than left at its default.
  # The grants are what the enabled paths write with.
  # Contents and actions cover the release upload and its artifact cleanup, and id-token covers the keyless NuGet push through OIDC trusted publishing.
  publish:
    name: Publish project release job
    needs: [plan, validate]
    if: ${{ needs.plan.outputs.publish == 'true' && needs.validate.result == 'success' }}
    uses: ptr727/ProjectTemplate/.github/workflows/build-release-task.yml@a3781210c622a61bdd3bbe31a6ac7a431c4a163d # 2.0.525
    secrets:
      NUGET_USERNAME: ${{ secrets.NUGET_USERNAME }}
    permissions:
      contents: write
      id-token: write
      actions: write
    with:
      ref: ${{ github.sha }}
      branch: ${{ github.ref_name }}
      smoke: false
      github: true
      nuget: true
      enable_nuget: true
      enable_docker: false
      enable_pypi: false
      enable_dotnet_publish: false
      nuget_project: ./Utilities/Utilities.csproj
