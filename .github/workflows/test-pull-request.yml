name: Test pull request action

# CI for every pull request into main or develop.
# The validate job is this repository's own task rather than the reusable one every other repository calls.
# That task's unit-test step runs the VSTest coverage invocation, and this repository's tests run on native Microsoft.Testing.Platform, where that invocation exits with zero tests ran.
# See CODESTYLE.md "Utilities .NET Conventions" and OPERATIONS.md "Local Verification" for the invocation this repository uses instead.
on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# GITHUB_TOKEN gets no scope by default, and each job below grants only what it reads with.
permissions: {}

jobs:

  # This repository builds one release target, the NuGet package.
  # The single filter entry excludes a workflow-only change from the smoke build rather than separating targets this repository does not have (D1.1, D1.4).
  changes:
    name: Detect changed targets job
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.filter.outputs.release }}
    steps:
      # Full history, since a workflow_dispatch run has no pull request to query and the filter diffs locally against the default branch instead.
      # A shallow checkout could leave it with no common ancestor to diff from.
      - name: Checkout code step
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Filter changed paths step
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            release:
              - '!.github/workflows/**'

  validate:
    name: Validate job
    uses: ./.github/workflows/validate-task.yml
    permissions:
      contents: read
    secrets: inherit

  # Build and pack the library in its branch configuration to prove it ships, publishing and uploading nothing (D1.3).
  # Setting smoke true hard-disables every publish path in the release task regardless of the flags below it.
  smoke-build:
    name: Smoke build job
    needs: [changes]
    if: needs.changes.outputs.release == 'true'
    uses: ptr727/ProjectTemplate/.github/workflows/build-release-task.yml@a3781210c622a61bdd3bbe31a6ac7a431c4a163d # 2.0.525
    permissions:
      contents: read
    with:
      smoke: true
      github: false
      nuget: false
      enable_nuget: true
      enable_docker: false
      enable_pypi: false
      enable_dotnet_publish: false
      nuget_project: ./Utilities/Utilities.csproj
      # On a pull_request event github.ref_name is the pull request ref, for example 123/merge, never the target branch.
      # The logical branch reads base_ref first and only falls back to ref_name on a non-pull-request trigger.
      branch: ${{ github.base_ref || github.ref_name }}

  # Single required status check.
  # Its name is the ruleset-bound context, so do not rename it without updating the ruleset in lockstep.
  # It treats a skipped smoke build, meaning an unchanged target, as a pass, and blocks on failure or cancelled (D1.5, D7.4).
  check-workflow-status:
    name: Check pull request workflow status job
    runs-on: ubuntu-latest
    needs: [changes, validate, smoke-build]
    if: always()
    steps:
      - name: Check workflow results step
        run: |
          set -Eeuo pipefail
          for result in "changes:${{ needs.changes.result }}" "validate:${{ needs.validate.result }}" "smoke-build:${{ needs.smoke-build.result }}"; do
            name="${result%%:*}"
            value="${result#*:}"
            if [[ "$value" != "success" && "$value" != "skipped" ]]; then
              echo "::error::Job '$name' did not succeed ($value)."
              exit 1
            fi
          done
